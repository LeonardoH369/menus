services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configura MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${DB_NAME:-menus}
      MYSQL_USER: ${DB_USER:-menus_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:${DB_PORT:-33317}:3306"
    volumes:
      - menus_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-menus.sql:ro

volumes:
  menus_data:
